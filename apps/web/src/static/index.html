<!doctype html>

    <meta name="theme-color" content="#0b0b0f" />

    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <h1>HolyDeck</h1>
      <!-- English until the client resolves the device language: one served shell, every locale. -->

      <noscript>This client needs JavaScript to prepare and present a service.</noscript>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
