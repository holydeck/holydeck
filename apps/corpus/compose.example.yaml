# Example deployment: HolyDeck server + MongoDB, from the published image.
# For hacking on the server itself use compose.dev.yaml in the repo root, which builds
# the image from the working tree instead of pulling it.
#
# The server has no auth or TLS of its own — put your reverse proxy in front
# (e.g. https://bible.example.com -> your-proxy -> server:3000) and terminate
# TLS / access control there.
services:
  server:
    image: ghcr.io/holydeck/server:latest
    restart: unless-stopped
    environment:
      HOLYDECK_MONGO_URL: mongodb://mongo:27017
      HOLYDECK_MONGO_DB: holydeck
      # bible.com answers plain HTTP clients with a JavaScript challenge. Set this to fetch
      # through the Chromium the image ships, which runs that challenge once per sync.
      HOLYDECK_BROWSER_FETCH: "true"
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
