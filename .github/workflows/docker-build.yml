name: docker-build

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to ghcr.io (build-check only when false)
        type: boolean
        default: false
      version:
        description: Release version to tag (required when push is true)
        type: string
        default: ""

# No job-level permissions block: a called workflow cannot exceed its
# caller's grant, so this job inherits them. ci.yml grants contents: read
# (enough for a build check); release.yml's caller job grants
# contents: read + packages: write (needed for the ghcr.io push).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the image tags
        id: tags
        shell: bash
        env:
          PUSH: ${{ inputs.push }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$PUSH" = "true" ]; then
            if [ -z "$VERSION" ]; then
              echo "the version input is required when push is true" >&2
              exit 1
            fi
            {
              echo 'tags<<TAGS'
              echo "ghcr.io/holydeck/server:$VERSION"
              echo "ghcr.io/holydeck/server:latest"
              echo 'TAGS'
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=holydeck-server:ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/holydeck/holydeck
            org.opencontainers.image.description=HolyDeck server
            org.opencontainers.image.licenses=MIT
