name: docker-build

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to ghcr.io (build-check only when false)
        type: boolean
        default: false
      version:
        description: Release version to tag (required when push is true)
        type: string
        default: ""

# A called workflow's own permissions cap what its caller's grant can hand down, so the build job
# below asks for exactly what it can use. ci.yml's caller grants only contents: read (enough for a
# build check), which caps packages: write and id-token: write away there — harmless, since the
# push- and sign-only steps stay inert (inputs.push is false). release.yml's caller grants the
# full set for a real push and signature.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The tag list is what tells the :latest guard below whether this
      # release is the newest one. Only push mode needs it, and the public
      # repo serves it without credentials.
      - name: Fetch the release tags
        if: inputs.push
        run: git fetch --tags --depth=1 origin
      - name: Resolve the release commit
        id: commit
        run: echo "sha=$(git rev-parse "${GITHUB_SHA}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the image tags
        id: tags
        shell: bash
        env:
          PUSH: ${{ inputs.push }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$PUSH" != "true" ]; then
            echo "tags=holydeck-server:ci" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$VERSION" ]; then
            echo "the version input is required when push is true" >&2
            exit 1
          fi
          # The tag being released is already pushed, so it is itself in this
          # list: it sorts first exactly when this is the newest release.
          # Re-running an older release's job therefore leaves :latest alone
          # instead of pointing it backwards.
          newest="$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*')"
          if [ -z "$newest" ]; then
            echo "no v* tags found, cannot tell whether v$VERSION is the newest release" >&2
            exit 1
          fi
          {
            echo 'tags<<TAGS'
            echo "ghcr.io/holydeck/server:$VERSION"
            if [ "$newest" = "v$VERSION" ]; then
              echo "ghcr.io/holydeck/server:latest"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
          if [ "$newest" != "v$VERSION" ]; then
            echo "$newest is newer than v$VERSION, leaving :latest where it is"
          fi
      - name: Build the server image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/corpus/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/holydeck/holydeck
            org.opencontainers.image.description=HolyDeck server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless signing: cosign exchanges this job's OIDC identity (id-token: write, above) with
      # Fulcio for a short-lived signing certificate, signs the pushed digest, and records the
      # signature in Rekor's public transparency log — no private key exists anywhere for this to
      # leak. Signs the digest rather than a tag, because a tag can move and a digest cannot,
      # which is what makes every tag above verify against this one signature. A signing failure
      # fails this step, and github-release (which needs this job) never runs — see RELEASING.md
      # for how a consumer verifies this independently.
      - name: Sign the image with cosign (keyless)
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/holydeck/server@${DIGEST}"
      - name: Record the pushed image tags
        if: inputs.push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "- $tag pushed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<<"$TAGS"
