name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache the MongoDB test binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the release scripts
        run: pnpm run test:release
      - name: Check the tag agrees with the manifests
        run: node scripts/release/verify-release-state.mjs "$GITHUB_REF_NAME"
      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build
      - name: Extract the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $version cannot do OIDC trusted publishing (need >= 11.5.1)" >&2
            exit 1
          fi
          echo "npm $version ok"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI bundle
        run: pnpm turbo build --filter=holydeck...
      # @holydeck/core is a private workspace library (bundled into the CLI),
      # so the CLI is the only npm artifact.
      - name: Pack the CLI
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          ls -l "$RUNNER_TEMP/tarballs"
      # No token anywhere: npm >= 11.5.1 exchanges this job's OIDC identity
      # with npmjs.com (trusted publisher: this repo + release.yml +
      # environment release) and attaches provenance automatically.
      - name: Publish holydeck to npmjs
        run: npm publish "$RUNNER_TEMP"/tarballs/holydeck-[0-9]*.tgz

  mirror-github-packages:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI bundle
        run: pnpm turbo build --filter=holydeck...
      - name: Authenticate npm to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Packages only hosts scoped packages, so the unscoped CLI
      # mirrors under the org scope as @holydeck/cli. npmjs stays canonical.
      - name: Mirror the CLI as @holydeck/cli
        run: |
          mkdir -p "$RUNNER_TEMP/mirror"
          (cd apps/cli && npm pkg set name=@holydeck/cli && pnpm pack --pack-destination "$RUNNER_TEMP/mirror")
          npm publish "$RUNNER_TEMP"/mirror/holydeck-cli-*.tgz --registry=https://npm.pkg.github.com

  docker:
    needs: [verify, publish-npm]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      version: ${{ needs.verify.outputs.version }}

  github-release:
    needs: [verify, mirror-github-packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract the changelog section
        run: node scripts/release/extract-notes.mjs "${{ needs.verify.outputs.version }}" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
