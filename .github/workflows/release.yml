name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the tagged commit's ancestry can be checked below.
          fetch-depth: 0
          persist-credentials: false
      # A tag can be pushed onto any commit, including one that never passed
      # review. Everything downstream of here trusts the tag, so refuse a tag
      # that is not on main before the human gate ever sees it.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from main" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache the MongoDB test binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the release scripts
        run: pnpm run test:release
      - name: Check the tag agrees with the manifests
        run: node scripts/release/verify-release-state.mjs "$GITHUB_REF_NAME"
      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build
      - name: Extract the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check npm supports staged trusted publishing
        run: |
          version="$(npm --version)"
          if [ "$(printf '%s\n' 11.15.0 "$version" | sort -V | head -n1)" != "11.15.0" ]; then
            echo "npm $version cannot do staged OIDC publishing (need >= 11.15.0)" >&2
            exit 1
          fi
          echo "npm $version ok"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI bundle
        run: pnpm turbo build --filter=holydeck...
      # @holydeck/core is a private workspace library (bundled into the CLI),
      # so the CLI is the only npm artifact.
      - name: Pack the CLI
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          ls -l "$RUNNER_TEMP/tarballs"
      # No token anywhere: npm exchanges this job's OIDC identity with
      # npmjs.com (trusted publisher: this repo + release.yml + environment
      # release) and attaches provenance automatically. Staging rather than
      # publishing means the version lands invisible until a maintainer
      # approves it with 2FA — see RELEASING.md.
      #
      # Re-run safety follows what npm actually allows a trust token to do.
      # A version that is already live is detectable with `npm view`; a
      # staged-but-unapproved one is not, because a trust token may only run
      # `npm publish` and `npm stage publish`, never `npm stage list`. So the
      # duplicate-version error that re-staging raises is recognised from
      # npm's own output and treated as "already there"; anything else — an
      # unauthorized action, a network failure — still fails the job.
      - name: Stage holydeck on npmjs
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "holydeck@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "holydeck@$VERSION is already live on npmjs, nothing to stage"
            exit 0
          fi
          if output="$(npm stage publish "$RUNNER_TEMP"/tarballs/holydeck-[0-9]*.tgz 2>&1)"; then
            echo "$output"
            echo "holydeck@$VERSION is staged, approve it to make it live (see RELEASING.md)"
            exit 0
          fi
          echo "$output"
          if echo "$output" | grep -qiE 'cannot publish over|already (exists|staged|published)|EPUBLISHCONFLICT|E409'; then
            echo "holydeck@$VERSION already exists as a staged version, nothing to stage"
            exit 0
          fi
          exit 1

  mirror-github-packages:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI bundle
        run: pnpm turbo build --filter=holydeck...
      - name: Authenticate npm to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Packages only hosts scoped packages, so the unscoped CLI
      # mirrors under the org scope as @holydeck/cli. npmjs stays canonical.
      - name: Mirror the CLI as @holydeck/cli
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@holydeck/cli@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@holydeck/cli@$VERSION is already on GitHub Packages, skipping"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/mirror"
          (cd apps/cli && npm pkg set name=@holydeck/cli && pnpm pack --pack-destination "$RUNNER_TEMP/mirror")
          npm publish "$RUNNER_TEMP"/mirror/holydeck-cli-*.tgz --registry=https://npm.pkg.github.com

  docker:
    needs: [verify, publish-npm]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      version: ${{ needs.verify.outputs.version }}

  github-release:
    needs: [verify, mirror-github-packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Extract the changelog section
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/release/extract-notes.mjs "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
