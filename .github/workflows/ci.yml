name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache the MongoDB test binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.4
      - name: Cache turbo output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # One step per check in scripts/verify/gate.mjs, in the gate's own order, and none of them stops
      # the run: someone reading a red build should see every check that failed, not only the first.
      - name: Test the release scripts
        if: ${{ !cancelled() }}
        run: pnpm run test:release
      - name: Test the workspace census
        if: ${{ !cancelled() }}
        run: pnpm run test:workspaces
      - name: Test the verification gate and the hooks
        if: ${{ !cancelled() }}
        run: pnpm run test:verify
      - name: Verify the compose stacks
        if: ${{ !cancelled() }}
        run: pnpm run verify:compose
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm turbo run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm turbo run typecheck
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm turbo run test
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm turbo run build
      - name: Install the browser the end-to-end suite drives
        if: ${{ !cancelled() }}
        run: pnpm --filter @holydeck/harness exec playwright install --with-deps chromium
      - name: Test in the browser
        if: ${{ !cancelled() }}
        run: pnpm turbo run test:e2e

  docker:
    needs: verify
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
