# Development stack: the corpus server, the application, the web development flow, the worker, the
# migration that has to run before any of them serves, and the MongoDB they store into — all built from
# this checkout.
# This is for testing and development only — compose.yaml in the repo root is the supported
# deployment, and it pulls the published corpus image instead of building one.
#
#   pnpm dev:server        # or: docker compose -f compose.dev.yaml up --build --wait
#   pnpm dev:server:down   # or: docker compose -f compose.dev.yaml down -v
#
# It builds from the working tree, so the running server is whatever the code says right now. Editing
# apps/web/src rebuilds the client in place; editing anything else means building the images again.
#
# Data lives in named volumes, so `down` and `up` again finds yesterday's work. `down -v` is the one that
# throws it away. compose.test.yaml is the opposite stack: it keeps nothing on purpose.
#
# No settings file is mounted here; the services read their defaults and the environment below. To try a
# settings.yaml, mount the directory that holds it — never the file itself, because saving it writes a
# new file and renames it over the old one, and a bind mount of a file follows the inode it was given.
#
# The corpus requires a credential here, the same way a deployment does, so the application can
# refuse to read a library that anybody could read. Point the CLI at it with
#   --server-url http://localhost:3000   and   HOLYDECK_SERVER_TOKEN=dev-corpus-token-not-a-secret
# Set HOLYDECK_CORPUS_TOKEN in your shell to use a different one; both services read the same value.
#
# HOLYDECK_MONGO_PASSWORD and HOLYDECK_MONGO_ROOT_PASSWORD default to the same kind of not-a-secret
# value below, rather than compose.yaml's required `${…:?}` (OPS-01): this stack is never a real
# deployment, so a fixed default costs nothing a real one would, and `pnpm dev:server` stays a single
# command with nothing to export first.
#
# Named explicitly so it never shares a default project name — and so the containers it starts — with
# compose.yaml, the supported deployment stack this same directory also holds.
name: holydeck-dev

services:
  corpus:
    build:
      context: .
      dockerfile: apps/corpus/Dockerfile
    environment:
      HOLYDECK_MONGO_URL: mongodb://holydeck:${HOLYDECK_MONGO_PASSWORD:-dev-mongo-app-not-a-secret}@mongo:27017?authSource=holydeck
      HOLYDECK_MONGO_DB: holydeck
      HOLYDECK_LOG_LEVEL: debug
      # bible.com answers plain HTTP clients with a JavaScript challenge. The image ships the
      # Chromium that passes it, so syncing from the dev stack behaves like the real thing.
      HOLYDECK_BROWSER_FETCH: "true"
      HOLYDECK_CORPUS_TOKEN: ${HOLYDECK_CORPUS_TOKEN:-dev-corpus-token-not-a-secret}
    # Published on loopback only: a corpus reachable from the network is a library anybody can read,
    # and the application refuses to start against one. The CLI on this machine still reaches it.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    # Health is declared in apps/corpus/Dockerfile, because a deployment that pulls the published image
    # gets the same check without copying it into its own Compose file.

  # Runs once, before anything serves: T19 made the application refuse a database whose schema version is
  # not the one it was built for, and this is what moves it there. Re-running it is a no-op, so every
  # `up` goes through it and every `up` records that it did.
  migrate:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    command: ["node", "/srv/app/dist/migrate.js"]
    environment:
      HOLYDECK_MONGO_URL: mongodb://holydeck:${HOLYDECK_MONGO_PASSWORD:-dev-mongo-app-not-a-secret}@mongo:27017/holydeck?authSource=holydeck
      HOLYDECK_LOG_LEVEL: debug
    volumes:
      - holydeck-dev-data:/data/holydeck
    depends_on:
      mongo:
        condition: service_healthy

  # The application and the worker are the same image with different commands; that is the point of
  # running both here. The application answers on 3100 so it does not collide with the corpus server,
  # and on every interface, because the phones and tablets it has to be tried on are not this machine.
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    environment:
      HOLYDECK_PORT: "3100"
      HOLYDECK_LOG_LEVEL: debug
      # The application reads the corpus over this network and never publishes it onwards.
      HOLYDECK_CORPUS_URL: http://corpus:3000
      HOLYDECK_CORPUS_TOKEN: ${HOLYDECK_CORPUS_TOKEN:-dev-corpus-token-not-a-secret}
      HOLYDECK_MONGO_URL: mongodb://holydeck:${HOLYDECK_MONGO_PASSWORD:-dev-mongo-app-not-a-secret}@mongo:27017/holydeck?authSource=holydeck
    ports:
      - "3100:3100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      corpus:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - holydeck-dev-data:/data/holydeck
      # The client the web service just built, read-only: the application serves it from its own origin
      # at the same relative path the image uses, so dev and deployment agree.
      - web-dist:/srv/web/dist:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The web development flow: esbuild watching the mounted source and writing into the volume the
  # application serves. It is healthy when the client it wrote is usable, not when the process is up —
  # a watching build survives a compile error, and serving the last good client while lying about it is
  # worse than saying so.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ./apps/web/src:/repo/apps/web/src:ro
      - web-dist:/repo/apps/web/dist
    healthcheck:
      test: ["CMD", "node", "/repo/apps/web/health.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    command: ["node", "/srv/worker/dist/main.js"]
    environment:
      HOLYDECK_LOG_LEVEL: debug
      HOLYDECK_MONGO_URL: mongodb://holydeck:${HOLYDECK_MONGO_PASSWORD:-dev-mongo-app-not-a-secret}@mongo:27017/holydeck?authSource=holydeck
    volumes:
      - holydeck-dev-data:/data/holydeck
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The worker serves no HTTP, so its health is the heartbeat it writes: it stops writing when the
    # data directory it needs goes away, which is the failure that would otherwise look like silence.
    healthcheck:
      test: ["CMD", "node", "/srv/worker/dist/health.js"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongo:
    image: mongo:8
    # Loopback only, like the corpus: this holds the records, and it requires no credential here.
    # mongosh or Compass on this machine still reach it.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${HOLYDECK_MONGO_ROOT_PASSWORD:-dev-mongo-root-not-a-secret}
      HOLYDECK_MONGO_PASSWORD: ${HOLYDECK_MONGO_PASSWORD:-dev-mongo-app-not-a-secret}
    volumes:
      - mongo-dev-data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # A plain ping succeeds even against the throwaway, unauthenticated mongod the entrypoint runs
      # the initdb scripts against, before it restarts into the authenticated instance this stack
      # actually depends on (ping is deliberately exempt from authorization) - so depends_on could
      # race a server that is mid-restart. listDatabases needs a session, so demanding it fail
      # unauthenticated is what actually proves the authenticated instance is the one answering.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" >/dev/null 2>&1 && ! mongosh --quiet --eval \"db.adminCommand('listDatabases')\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  holydeck-dev-data:
  mongo-dev-data:
  web-dist:
